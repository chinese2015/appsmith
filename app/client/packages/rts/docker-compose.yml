version: '3'

services:
  appsmith-rts:
    image: appsmith-rts
    container_name: appsmith-rts
    ports:
      - "8091:8091"
    environment:
      - APPSMITH_API_BASE_URL=http://host.docker.internal:8080/api/v1
      - PORT=8091
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped